<style>

.btn.g{background:var(--in);color:var(--tx);border:1px solid var(--bd);box-shadow:none}

.out{padding:12px;border-radius:12px;background:var(--in);border:1px dashed var(--bd);word-break:break-all;white-space:pre-wrap}

.sw .sug a{display:flex;gap:8px;align-items:center}
.sw input{padding-right:40px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}.feat div{padding:16px}.feat p{color:var(--mu);margin:4px 0 0;font-size:14px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:24px}
table{border-collapse:collapse;width:100%}td{padding:4px 8px;border-bottom:1px solid var(--bd)}
.sw2{display:flex;gap:8px;flex-wrap:wrap}.sw2 b{width:56px;height:56px;border-radius:14px;cursor:pointer;display:flex;align-items:flex-end;font-size:9px;padding:3px;color:#fff;text-shadow:0 0 3px #000}
.task{display:flex;gap:10px;align-items:center;padding:6px 0}.task input{width:auto}.task.d span{text-decoration:line-through;opacity:.5}
</style></head><body>

<script>

const kb=n=>(n/1024).toFixed(1)+' KB';

const PDFL='https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',QRL='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
const word=t=>(t.trim().match(/\S+/g)||[]).length;

const T=[
{id:'palabras',n:'Contador de palabras y caracteres',c:'Texto',i:'txt',d:'Cuenta palabras, caracteres, líneas y tiempo de lectura.',k:'contar letras caracteres words count lectura',r:e=>{e.innerHTML='<textarea id=a placeholder="Pega o escribe tu texto"></textarea><div class=out id=o></div>';const f=()=>{const t=$('#a',e).value;$('#o',e).textContent=`Palabras: ${word(t)}\nCaracteres: ${t.length}\nSin espacios: ${t.replace(/\s/g,'').length}\nLíneas: ${t?t.split('\n').length:0}\nLectura: ${Math.ceil(word(t)/220)} min`};$('#a',e).oninput=f;f()}},
{id:'mayusculas',n:'Conversor de mayúsculas y minúsculas',c:'Texto',i:'txt',d:'MAYÚSCULAS, minúsculas, Título y oración.',k:'uppercase lowercase capitalizar cambiar letras',r:e=>{e.innerHTML='<textarea id=a></textarea><div class=row><button class=btn data-m=u>MAYÚSCULAS</button><button class=btn data-m=l>minúsculas</button><button class=btn data-m=t>Título</button><button class=btn data-m=s>Oración</button></div><button class="btn g" id=c>Copiar</button>';const a=$('#a',e);$$('[data-m]',e).forEach(b=>b.onclick=()=>{const m=b.dataset.m,v=a.value;a.value=m=='u'?v.toUpperCase():m=='l'?v.toLowerCase():m=='t'?v.toLowerCase().replace(/(^|\s)\S/g,x=>x.toUpperCase()):v.toLowerCase().replace(/(^\s*|[.!?]\s+)(\S)/g,(_,p,q)=>p+q.toUpperCase())});$('#c',e).onclick=()=>copy(a.value)}},
{id:'espacios',n:'Eliminar espacios duplicados',c:'Texto',i:'txt',d:'Limpia espacios y saltos de línea repetidos.',k:'limpiar espacios blancos formato',r:e=>{e.innerHTML='<textarea id=a></textarea><button class=btn id=b>Limpiar</button><div class=out id=o>El resultado aparecerá aquí.</div>';$('#b',e).onclick=()=>{const v=$('#a',e).value;if(!v)return toast('Escribe un texto primero');const r=v.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();$('#o',e).textContent=r;copy(r)}}},
{id:'lorem',n:'Generador de Lorem Ipsum',c:'Texto',i:'txt',d:'Párrafos de texto de relleno.',k:'relleno placeholder texto falso',r:e=>{e.innerHTML='<div class=row><input id=n type=number min=1 max=20 value=3><button class=btn id=b>Generar</button></div><div class=out id=o></div>';const w='lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim minim veniam quis nostrud exercitation ullamco laboris nisi aliquip commodo consequat'.split(' ');$('#b',e).onclick=()=>{const n=Math.min(20,Math.max(1,+$('#n',e).value||1));$('#o',e).textContent=Array.from({length:n},()=>{let s=Array.from({length:40+rnd(30)},()=>w[rnd(w.length)]).join(' ');return s[0].toUpperCase()+s.slice(1)+'.'}).join('\n\n')};$('#b',e).click()}},
{id:'comparar',n:'Comparador de textos',c:'Texto',i:'cmp',d:'Muestra líneas añadidas y eliminadas entre dos textos.',k:'diferencias diff comparar versiones',r:e=>{e.innerHTML='<div class=row><textarea id=a placeholder="Texto original"></textarea><textarea id=b placeholder="Texto nuevo"></textarea></div><button class=btn id=g>Comparar</button><div class=out id=o></div>';$('#g',e).onclick=()=>{const a=$('#a',e).value.split('\n'),b=$('#b',e).value.split('\n'),sa=new Set(a),sb=new Set(b);const o=$('#o',e);o.textContent='';a.forEach(l=>{if(!sb.has(l))o.append(Object.assign(document.createElement('div'),{textContent:'− '+l,style:'color:#ff5b6e'}))});b.forEach(l=>{if(!sa.has(l))o.append(Object.assign(document.createElement('div'),{textContent:'+ '+l,style:'color:#2fc27a'}))});if(!o.children.length)o.textContent='Los textos son idénticos.'}}},
{id:'password',n:'Generador de contraseñas',c:'Generadores',i:'key',d:'Contraseñas seguras con criptografía del navegador.',k:'clave segura aleatoria password',r:e=>{e.innerHTML='<div class=row><label>Longitud <input id=l type=number min=6 max=64 value=18></label><label>Símbolos <select id=s><option value=1>Sí<option value=0>No</select></label></div><button class=btn id=b>Generar</button><div class=out id=o></div>';$('#b',e).onclick=()=>{const L=Math.min(64,Math.max(6,+$('#l',e).value||18)),ch='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'+($('#s',e).value=='1'?'!@#$%&*?-_':'');const p=Array.from({length:L},()=>ch[rnd(ch.length)]).join('');$('#o',e).textContent=p;copy(p)};$('#b',e).click()}},
{id:'uuid',n:'Generador de UUID',c:'Generadores',i:'key',d:'Identificadores únicos v4.',k:'identificador unico guid',r:e=>{e.innerHTML='<button class=btn id=b>Generar 5 UUID</button><div class=out id=o></div>';$('#b',e).onclick=()=>{const u=Array.from({length:5},()=>crypto.randomUUID()).join('\n');$('#o',e).textContent=u;copy(u)};$('#b',e).click()}},
{id:'colores',n:'Generador de colores y paletas',c:'Generadores',i:'pal',d:'Paletas armónicas a partir de un color base.',k:'color paleta hex rgb diseño',r:e=>{e.innerHTML='<div class=row><input id=c type=color value="#3b5bff"><select id=m><option value=a>Análoga<option value=c>Complementaria<option value=t>Triádica<option value=r>Aleatoria</select><button class=btn id=b>Generar</button></div><div class=sw2 id=o></div>';const hx=(h,s,l)=>{h=((h%360)+360)%360;s/=100;l/=100;const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return'#'+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,'0')).join('')};const hue=c=>{const r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255,M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let h=d==0?0:M==r?((g-b)/d)%6:M==g?(b-r)/d+2:(r-g)/d+4;return h*60};$('#b',e).onclick=()=>{const h=hue($('#c',e).value),m=$('#m',e).value,o=$('#o',e);const H=m=='a'?[-40,-20,0,20,40]:m=='c'?[0,180,30,210,-30]:m=='t'?[0,120,240,60,180]:Array.from({length:5},()=>rnd(360)-h);o.innerHTML='';H.forEach((d,i)=>{const x=hx(h+d,70,45+i*3),b=document.createElement('b');b.style.background=x;b.textContent=x;b.title='Copiar '+x;b.onclick=()=>copy(x);o.append(b)})};$('#b',e).click()}},
{id:'qr',n:'Generador de códigos QR',c:'Generadores',i:'qr',d:'Crea un QR descargable para texto o enlaces.',k:'qr codigo enlace url',r:e=>{e.innerHTML='<input id=t placeholder="https://ejemplo.com"><button class=btn id=b>Crear QR</button><div id=o></div>';$('#b',e).onclick=async()=>{const v=$('#t',e).value.trim();if(!v)return toast('Escribe un texto o enlace');try{await load(QRL);const q=qrcode(0,'M');q.addData(v);q.make();const u=q.createDataURL(8,4);$('#o',e).innerHTML=`<img src="${u}" alt="Código QR" style="width:240px;max-width:100%;border-radius:12px;background:#fff"><br><a class=btn download=qr.png href="${u}" style="display:inline-block;margin-top:10px;text-decoration:none">Descargar PNG</a>`}catch(x){toast(x.message)}}}},
{id:'imagen',n:'Convertir, comprimir y redimensionar imágenes',c:'Imágenes',i:'img',d:'PNG, JPG y WebP con calidad y tamaño a medida.',k:'comprimir imagen pequeña peso reducir tamaño convertir png jpg webp redimensionar dimensiones foto',r:e=>{e.innerHTML='<input id=f type=file accept="image/*"><div class=row><select id=t><option value=image/webp>WebP<option value=image/jpeg>JPG<option value=image/png>PNG</select><label>Calidad <input id=q type=range min=10 max=100 value=80></label><input id=w type=number min=1 placeholder="Ancho (px, opcional)"></div><button class=btn id=b>Procesar</button><div class=bar><i id=p></i></div><div class=out id=o>Elige una imagen.</div>';$('#b',e).onclick=()=>{const f=$('#f',e).files[0];if(!f)return toast('Selecciona una imagen');const im=new Image(),u=URL.createObjectURL(f);$('#p',e).style.width='30%';im.onerror=()=>{$('#o',e).textContent='Ese archivo no es una imagen válida.'};im.onload=()=>{const w=+$('#w',e).value||im.width,h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if($('#t',e).value=='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);$('#p',e).style.width='80%';c.toBlob(b=>{$('#p',e).style.width='100%';const ext=$('#t',e).value.split('/')[1].replace('jpeg','jpg');$('#o',e).textContent=`${im.width}×${im.height} → ${w}×${h}\n${kb(f.size)} → ${kb(b.size)}`;dl(b,'utilify.'+ext)},$('#t',e).value,$('#q',e).value/100)};im.src=u}}},
{id:'pdf-unir',n:'Unir PDF',c:'PDF',i:'doc',d:'Combina varios PDF en uno.',k:'juntar combinar pdf merge',r:e=>{e.innerHTML='<input id=f type=file accept=application/pdf multiple><button class=btn id=b>Unir y descargar</button><div class=bar><i id=p></i></div><div class=out id=o>Selecciona 2 o más PDF, en el orden deseado.</div>';$('#b',e).onclick=async()=>{const fs=[...$('#f',e).files];if(fs.length<2)return toast('Selecciona al menos 2 PDF');try{await load(PDFL);const d=await PDFLib.PDFDocument.create();for(let i=0;i<fs.length;i++){const s=await PDFLib.PDFDocument.load(await fs[i].arrayBuffer());(await d.copyPages(s,s.getPageIndices())).forEach(p=>d.addPage(p));$('#p',e).style.width=(i+1)/fs.length*100+'%'}const by=await d.save();dl(new Blob([by],{type:'application/pdf'}),'unido.pdf');$('#o',e).textContent=`Listo: ${d.getPageCount()} páginas, ${kb(by.length)}`}catch(x){$('#o',e).textContent='Error: algún archivo no es un PDF válido o está protegido.'}}}},
{id:'pdf-paginas',n:'Extraer o eliminar páginas de PDF',c:'PDF',i:'doc',d:'Indica rangos como 1-3,5 para conservar o eliminar.',k:'dividir separar pdf split extraer eliminar borrar páginas',r:e=>{e.innerHTML='<input id=f type=file accept=application/pdf><div class=row><input id=r placeholder="Rango: 1-3,5"><select id=m><option value=k>Conservar estas<option value=d>Eliminar estas</select></div><button class=btn id=b>Crear PDF</button><div class=out id=o></div>';$('#b',e).onclick=async()=>{const f=$('#f',e).files[0];if(!f)return toast('Selecciona un PDF');try{await load(PDFL);const s=await PDFLib.PDFDocument.load(await f.arrayBuffer()),n=s.getPageCount(),set=new Set();$('#r',e).value.split(',').forEach(x=>{const[a,b]=x.split('-').map(Number);if(a)for(let i=a;i<=(b||a);i++)if(i>=1&&i<=n)set.add(i-1)});if(!set.size)return $('#o',e).textContent='Rango no válido. El PDF tiene '+n+' páginas.';const keep=$('#m',e).value=='k'?[...set].sort((a,b)=>a-b):s.getPageIndices().filter(i=>!set.has(i));if(!keep.length)return $('#o',e).textContent='No quedarían páginas.';const d=await PDFLib.PDFDocument.create();(await d.copyPages(s,keep)).forEach(p=>d.addPage(p));dl(new Blob([await d.save()],{type:'application/pdf'}),'paginas.pdf');$('#o',e).textContent=`Listo: ${keep.length} de ${n} páginas`}catch{$('#o',e).textContent='No se pudo leer el PDF.'}}}},
{id:'unidades',n:'Conversor de unidades',c:'Productividad',i:'chk',d:'Longitud, masa y temperatura.',k:'convertir metros km kg libras celsius fahrenheit',r:e=>{const U={Longitud:{m:1,km:1e3,cm:.01,mi:1609.344,ft:.3048,in:.0254},Masa:{kg:1,g:.001,lb:.45359237,oz:.0283495},Temperatura:{'°C':0,'°F':0,K:0}};e.innerHTML='<select id=k></select><div class=row><input id=v type=number value=1><select id=a></select><select id=z></select></div><div class=out id=o></div>';const k=$('#k',e);Object.keys(U).forEach(x=>k.add(new Option(x)));const fill=()=>{const o=Object.keys(U[k.value]).map(x=>`<option>${x}`).join('');$('#a',e).innerHTML=o;$('#z',e).innerHTML=o;$('#z',e).selectedIndex=1;go()};const go=()=>{const v=+$('#v',e).value,a=$('#a',e).value,z=$('#z',e).value;let r;if(k.value=='Temperatura'){const c=a=='°C'?v:a=='°F'?(v-32)*5/9:v-273.15;r=z=='°C'?c:z=='°F'?c*9/5+32:c+273.15}else r=v*U[k.value][a]/U[k.value][z];$('#o',e).textContent=`${v} ${a} = ${+r.toPrecision(8)} ${z}`};k.onchange=fill;e.oninput=go;fill()}},
{id:'temporizador',n:'Temporizador y cronómetro',c:'Productividad',i:'clk',d:'Cuenta atrás y cronómetro con vueltas.',k:'timer cronometro tiempo alarma stopwatch',r:e=>{e.innerHTML='<div class=row><input id=m type=number min=1 value=5><button class=btn id=s>Iniciar cuenta atrás</button></div><div class=out id=o style="font-size:34px;text-align:center">05:00</div><div class=row><button class=btn id=c>Cronómetro: iniciar</button><button class="btn g" id=x>Reiniciar</button></div><div class=out id=w style="font-size:28px;text-align:center">00:00.0</div>';const f=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');let ti,ci,t0,el=0,run=0;$('#s',e).onclick=()=>{clearInterval(ti);let r=Math.round(+$('#m',e).value*60);if(r<1)return toast('Introduce minutos válidos');$('#o',e).textContent=f(r);ti=setInterval(()=>{r--;$('#o',e).textContent=f(r);if(r<=0){clearInterval(ti);toast('Tiempo terminado');navigator.vibrate?.(300)}},1e3)};const dw=()=>{const s=el+(run?(Date.now()-t0)/1e3:0);$('#w',e).textContent=f(s)+'.'+Math.floor(s*10%10)};$('#c',e).onclick=()=>{if(run){el+=(Date.now()-t0)/1e3;run=0;clearInterval(ci);$('#c',e).textContent='Cronómetro: reanudar'}else{t0=Date.now();run=1;ci=setInterval(dw,100);$('#c',e).textContent='Cronómetro: pausar'}};$('#x',e).onclick=()=>{clearInterval(ti);clearInterval(ci);run=0;el=0;dw();$('#c',e).textContent='Cronómetro: iniciar'};e._off=()=>{clearInterval(ti);clearInterval(ci)}}},
{id:'tareas',n:'Lista de tareas',c:'Productividad',i:'chk',d:'Tareas guardadas en tu dispositivo.',k:'todo pendientes recordatorios notas',r:e=>{e.innerHTML='<div class=row><input id=t placeholder="Nueva tarea"><button class=btn id=b style="flex:0">Añadir</button></div><div id=l></div>';let L=S('todo',[]);const dr=()=>{const l=$('#l',e);l.innerHTML=L.length?'':'<div class=out>Sin tareas. Añade la primera arriba.</div>';L.forEach((t,i)=>{const d=document.createElement('div');d.className='task'+(t.d?' d':'');d.innerHTML='<input type=checkbox '+(t.d?'checked':'')+'><span></span><button class="btn g" style="margin-left:auto;padding:4px 10px">Borrar</button>';$('span',d).textContent=t.t;$('input',d).onchange=()=>{t.d=!t.d;W('todo',L);dr()};$('button',d).onclick=()=>{if(confirm('¿Borrar esta tarea?')){L.splice(i,1);W('todo',L);dr()}};l.append(d)})};$('#b',e).onclick=()=>{const v=$('#t',e).value.trim();if(!v)return toast('Escribe una tarea');L.push({t:v,d:0});$('#t',e).value='';W('todo',L);dr()};dr()}}

const cats=['Todas','Texto','Generadores','Imágenes','PDF','Productividad'];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const score=(t,q)=>{const h=norm(t.n+' '+t.k+' '+t.d+' '+t.c),w=norm(q).split(/\s+/).filter(x=>x.length>2);return w.reduce((s,x)=>s+(h.includes(x)?2:h.includes(x.slice(0,4))?1:0),0)};
const find=q=>T.map(t=>[score(t,q),t]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);

if(h=='home'){const pop=T.slice(0,6);a.innerHTML=`<section class=hero><h1>Everything you need.<br>One platform.</h1><p>${T.length} herramientas reales de PDF, imagen, texto y productividad. Sin subidas, sin esperas: todo ocurre en tu dispositivo.</p><button class=btn id=ex>Explorar herramientas</button></section><div class=stats><div class=glass><b>${T.length}</b><span>Herramientas</span></div><div class=glass><b>0</b><span>Archivos subidos</span></div><div class=glass><b>100%</b><span>En tu navegador</span></div></div><h2>Populares</h2><div class=grid>${pop.map(card).join('')}</div>${favs.length?`<h2>Tus favoritas</h2><div class=grid>${T.filter(t=>favs.includes(t.id)).map(card).join('')}</div>`:''}${hist.length?`<h2>Usadas recientemente</h2><div class=grid>${hist.map(i=>T.find(t=>t.id==i)).filter(Boolean).map(card).join('')}</div>`:''}<div class=feat><div class=glass><h3>Privado por diseño</h3><p>Los archivos nunca salen de tu dispositivo.</p></div><div class=glass><h3>Rápido</h3><p>Bibliotecas pesadas solo se cargan al usarlas.</p></div><div class=glass><h3>Instantáneo</h3><p>Sin registro ni límites.</p></div></div>`;$('#ex').onclick=()=>go('tools');bind()}
else if(h=='tools'){a.innerHTML=`<h2>Herramientas</h2><div class=chips>${cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${c}">${c}</button>`).join('')}</div><div class=grid id=g></div>`;const g=()=>{const l=T.filter(t=>cat=='Todas'||t.c==cat);$('#g').innerHTML=l.map(card).join('');bind()};$$('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;$$('.chip').forEach(x=>x.classList.toggle('on',x==b));g()});g()}
else if(h.startsWith('s-')){const q=decodeURIComponent(h.slice(2)),r=find(q);a.innerHTML=`<h2>Resultados para «${q.replace(/[<>&]/g,'')}»</h2>`+(r.length?`<div class=grid>${r.map(card).join('')}</div>`:'<div class="glass panel">No encontramos herramientas con esa descripción. Prueba con palabras como «imagen», «pdf» o «contraseña».</div>');bind()}
else if(h.startsWith('t-')){const t=T.find(x=>'t-'+x.id==h);if(!t)return nf();hist=[t.id,...hist.filter(x=>x!=t.id)].slice(0,6);W('hist',hist);a.innerHTML=`<button class="btn g" id=bk>Volver</button><h2>${t.n}</h2><p style="color:var(--mu)">${t.d}</p><div class="glass panel" id=tool></div>`;$('#bk').onclick=()=>history.back();cur=$('#tool');t.r(cur)}
